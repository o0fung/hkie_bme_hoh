[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hkie-bme-hoh"
version = "1.2.1"
description = "HKIE BME Dual Grip Game - A kid-friendly game for controlling exoskeleton hand braces using EMG sensors"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "HKIE BME Team"}
]
keywords = ["game", "ble", "emg", "exoskeleton", "pygame"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]

dependencies = [
    "pygame-ce>=2.5.0",
    "bleak>=0.21.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
run_hoh_game = "app.__main__:main"

[project.urls]
Homepage = "https://github.com/o0fung/hkie_bme_hoh"
Repository = "https://github.com/o0fung/hkie_bme_hoh"

[tool.setuptools]
packages = ["app", "config", "assets"]
include-package-data = true

[tool.setuptools.package-data]
"config" = ["*.json"]
"assets" = ["*.json", "*.jpg", "*.jpeg", "*.png", "*.webp"]

