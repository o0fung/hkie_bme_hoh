[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hoh-game"
version = "1.4.3"
description = "HKIE BME Dual Grip Game - A kid-friendly game for controlling exoskeleton hand braces using EMG sensors"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "HKIE BME Team"}
]
keywords = ["game", "ble", "emg", "exoskeleton", "pygame"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]

dependencies = [
    "pygame-ce>=2.5.0",
    "bleak>=0.21.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
run_hoh_game = "app.__main__:main"

[project.urls]
Homepage = "https://github.com/o0fung/hkie_bme_hoh"
Repository = "https://github.com/o0fung/hkie_bme_hoh"
Issues = "https://github.com/o0fung/hkie_bme_hoh/issues"
Releases = "https://github.com/o0fung/hkie_bme_hoh/releases"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*", "config*", "assets*"]

[tool.setuptools.package-data]
"config" = ["*.json"]
"assets" = ["*.json", "*.jpg", "*.jpeg", "*.png", "*.webp"]

